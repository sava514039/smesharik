<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Какой ты смешнарик</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.75)),
        url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #333;
    }

    .container {
      max-width: 600px;
      width: 90%;
      padding: 50px 35px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      color: #2e7d32;
    }

    .subtitle {
      margin-bottom: 30px;
      color: #546e7a;
      font-size: 1rem;
    }

    .btn {
      padding: 14px 44px;
      font-size: 1.15rem;
      border: none;
      border-radius: 12px;
      background: #4caf50;
      color: white;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(76, 175, 80, 0.4);
    }

    .btn:disabled {
      background: #bbb;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .result {
      display: none;
      margin-top: 30px;
      padding: 30px;
      background: linear-gradient(135deg, #e8f5e9, #fffde7);
      border-radius: 16px;
      border: 2px solid #4caf50;
      animation: popIn 0.5s ease forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .result-label {
      font-size: 1rem;
      color: #546e7a;
      margin-bottom: 8px;
    }

    .result-character {
      font-size: 2.2rem;
      font-weight: bold;
      color: #2e7d32;
      margin: 5px 0;
    }

    .result-num {
      font-size: 0.9rem;
      color: #888;
      margin-top: 10px;
    }

    .loading {
      display: none;
      margin-top: 20px;
      color: #78909c;
      font-size: 0.95rem;
    }

    .error {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #fff3e0;
      border-radius: 12px;
      border-left: 4px solid #ff9800;
      color: #e65100;
      font-size: 1rem;
    }

    .hint {
      margin-top: 25px;
      color: #90a4ae;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎁 Тайный Санта</h1>
    <p class="subtitle">Нажми кнопку, чтобы узнать своего персонажа</p>

    <button class="btn" id="drawBtn" onclick="drawCharacter()">Мне выпадет…</button>

    <div class="loading" id="loading">Подбираем персонажа…</div>

    <div class="result" id="result">
      <p class="result-label">Тебе достался:</p>
      <div class="result-character" id="characterName">—</div>
      <div class="result-num" id="resultNum"></div>
    </div>

    <div class="error" id="error"></div>

    <p class="hint">Персонажи распределяются случайным образом и не повторяются.</p>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // === ВСТАВЬ СВОЙ КОНФИГ ИЗ FIREBASE ===
    const firebaseConfig = {
  apiKey: "AIzaSyAe3TZyDMG4JvS_ccGy3VxduQgCEpCTDA8",
  authDomain: "smesharik-857ae.firebaseapp.com",
  projectId: "smesharik-857ae",
  storageBucket: "smesharik-857ae.firebasestorage.app",
  messagingSenderId: "165009269489",
  appId: "1:165009269489:web:d9d443311515451826bf50"
};


    // Инициализация Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // === НАСТРОЙКИ ===
    const characters = [
      "Крош", "Ёжик", "Нюша", "Бараш",
      "Лосяш", "Пин", "Копатыч", "Совунья", "Кар-Карыч"
    ];

    const maxPeople = 6; // сколько человек могут получить персонажа

    // === ЛОГИКА ===
    let alreadyAssigned = false;

    // Проверяем при загрузке, не получал ли этот браузер уже персонажа
    window.addEventListener('load', () => {
      const saved = localStorage.getItem('santa_assigned');
      if (saved) {
        const data = JSON.parse(saved);
        showResult(data.character, data.num);
        alreadyAssigned = true;
        document.getElementById('drawBtn').disabled = true;
        document.getElementById('drawBtn').textContent = 'Ты уже получил персонажа';
      }
    });

    function showResult(character, num) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('result').style.display = 'block';
      document.getElementById('characterName').textContent = character;
      document.getElementById('resultNum').textContent =
        `Ты — человек №${num} из ${maxPeople}`;
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = msg;
    }

    function drawCharacter() {
      if (alreadyAssigned) return;

      const btn = document.getElementById('drawBtn');
      btn.disabled = true;
      document.getElementById('loading').style.display = 'block';

      // Читаем текущее состояние из базы
      db.ref('assignments').transaction((data) => {
        if (data === null) data = { count: 0, taken: {} };

        // Проверяем, не все ли места заняты
        if (data.count >= maxPeople) {
          return; // отменяем транзакцию — вернёт текущие данные
        }

        // Собираем занятые персонажи
        const takenChars = [];
        if (data.taken) {
          for (const key in data.taken) {
            takenChars.push(data.taken[key]);
          }
        }

        // Находим свободных
        const available = characters.filter(c => !takenChars.includes(c));
        if (available.length === 0) {
          return; // нечего раздавать
        }

        // Выбираем случайного
        const randomIndex = Math.floor(Math.random() * available.length);
        const chosen = available[randomIndex];

        // Записываем в базу
        const newCount = data.count + 1;
        const newKey = 'p' + newCount;
        if (!data.taken) data.taken = {};
        data.taken[newKey] = chosen;
        data.count = newCount;

        // Сохраняем локально, чтобы при обновлении страницы
        // человек видел того же персонажа
        localStorage.setItem('santa_assigned', JSON.stringify({
          character: chosen,
          num: newCount
        }));

        // Показываем результат
        showResult(chosen, newCount);
        document.getElementById('drawBtn').textContent = 'Готово!';

        return data; // коммитим транзакцию
      }).then((result) => {
        if (!result.committed) {
          // Транзакция не закоммичена — значит, мест больше нет
          db.ref('assignments/count').once('value').then((snap) => {
            const count = snap.val() || 0;
            if (count >= maxPeople) {
              showError('Увы, все места уже заняты! 🙁');
            } else {
              showError('Что-то пошло не так. Попробуй обновить страницу и нажать ещё раз.');
            }
            btn.disabled = false;
          });
        }
      }).catch((err) => {
        showError('Ошибка соединения. Проверь интернет и попробуй снова.');
        btn.disabled = false;
      });
    }
  </script>

</body>
</html>
