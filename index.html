<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Какой ты смешнарик</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f4f8;
      color: #333;
    }

    .container {
      max-width: 450px;
      width: 90%;
      padding: 30px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.8rem;
      color: #2c3e50;
      line-height: 1.2;
    }

    h1 span {
      color: #e67e22; /* Оранжевый цвет для акцента */
    }

    .subtitle {
      margin-bottom: 30px;
      color: #7f8c8d;
      font-size: 0.95rem;
    }

    .btn {
      padding: 16px 40px;
      font-size: 1.1rem;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
    }

    .btn:hover {
      background-color: #2980b9;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
    }

    .btn:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .loading {
      margin-top: 20px;
      color: #3498db;
      font-weight: bold;
      display: none;
    }

    .error {
      margin-top: 20px;
      padding: 15px;
      background-color: #ffebee;
      color: #c62828;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .result-box {
      margin-top: 30px;
      padding: 25px;
      background: linear-gradient(135deg, #f1f8e9, #e8f5e9);
      border: 2px solid #4caf50;
      border-radius: 15px;
      display: none;
      animation: popIn 0.5s ease forwards;
    }

    .result-label {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .result-character {
      font-size: 2.2rem;
      font-weight: bold;
      color: #2e7d32;
      margin: 10px 0;
    }

    .result-num {
      font-size: 0.9rem;
      color: #666;
    }

    /* Стили для админ-кнопки */
    .admin-panel {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px dashed #ccc;
    }

    .admin-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .admin-btn:hover {
      background-color: #c0392b;
    }

    .hint {
      margin-top: 25px;
      font-size: 0.8rem;
      color: #95a5a6;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Какой ты <span>смешнарик</span></h1>
    <p class="subtitle">Нажми кнопку, чтобы узнать своего персонажа</p>

    <button class="btn" id="drawBtn" onclick="drawCharacter()">Мне выпадет…</button>

    <div class="loading" id="loading">Подбираем идеального смешнарика… 🎲</div>
    <div class="error" id="error"></div>

    <div class="result-box" id="result">
      <div class="result-label">Тебе достался:</div>
      <div class="result-character" id="charName">—</div>
      <div class="result-num" id="charNum">—</div>
    </div>

    <!-- Сюда JS добавит кнопку сброса, если ты админ -->
    <div class="admin-panel" id="adminPanel"></div>

    <p class="hint">Персонажи распределяются случайно и не повторяются. Данные хранятся в базе.</p>
  </div>

  <!-- Подключаем Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // ================= НАСТРОЙКИ =================
    
    // 1. ВСТАВЬ СЮДА СВОИ КЛЮЧИ ИЗ FIREBASE CONSOLE
    const firebaseConfig = {
      apiKey: "AIzaSy...ВСТАВЬ_СЮДА...",
      authDomain: "secret-santa-...firebaseapp.com",
      databaseURL: "https://secret-santa-...-default-rtdb.firebaseio.com",
      projectId: "secret-santa-...",
      storageBucket: "secret-santa-...appspot.com",
      messagingSenderId: "...",
      appId: "..."
    };

    // 2. ПРИДУМАЙ СВОЙ ПАРОЛЬ ДЛЯ ДОСТУПА К КНОПКЕ СБРОСА
    // Чтобы увидеть кнопку, открой ссылку: .../index.html?admin=ТВОЙ_ПАРОЛЬ
    const ADMIN_CODE = "Code123"; 

    // Список персонажей
    const characters = ["Крош", "Ёжик", "Нюша", "Бараш", "Лосяш", "Пин", "Копатыч", "Совунья", "Кар-Карыч"];
    const maxPeople = 6; // Лимит участников

    // ================= ИНИЦИАЛИЗАЦИЯ =================
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    let alreadyAssigned = false;

    // ================= ЗАГРУЗКА СТРАНИЦЫ =================
    window.addEventListener('load', () => {
      // Проверяем, не получал ли уже персонаж в этом браузере
      const saved = localStorage.getItem('santa_assigned');
      if (saved) {
        const data = JSON.parse(saved);
        showResult(data.character, data.num);
        alreadyAssigned = true;
        const btn = document.getElementById('drawBtn');
        btn.disabled = true;
        btn.textContent = "Ты уже получил персонажа";
      }

      // ПРОВЕРКА АДМИН-РЕЖИМА
      const urlParams = new URLSearchParams(window.location.search);
      const isAdmin = urlParams.get('admin') === ADMIN_CODE;

      if (isAdmin) {
        const adminBtn = document.createElement('button');
        adminBtn.className = 'admin-btn';
        adminBtn.textContent = '🗑️ СБРОСИТЬ ВСЕ РЕЗУЛЬТАТЫ';
        
        adminBtn.onclick = () => {
          if (!confirm('⚠️ ЭТО НЕЛЬЗЯ ОТМЕНИТЬ!\nТы точно хочешь удалить все результаты розыгрыша?')) {
            return;
          }
          
          db.ref('assignments').remove()
            .then(() => {
              alert('✅ База очищена! Теперь можно начинать новый розыгрыш.');
              // Очищаем локальное хранилище у себя, чтобы кнопка снова работала
              localStorage.removeItem('santa_assigned');
              location.reload(); // Перезагружаем страницу
            })
            .catch(err => {
              alert('❌ Ошибка при удалении: ' + err.message);
            });
        };

        document.getElementById('adminPanel').appendChild(adminBtn);
      }
    });

    // ================= ФУНКЦИИ =================
    function showResult(character, num) {
      document.getElementById('result').style.display = 'block';
      document.getElementById('charName').textContent = character;
      document.getElementById('charNum').textContent = `Ты — человек №${num} из ${maxPeople}`;
      document.getElementById('loading').style.display = 'none';
    }

    function showError(msg) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = msg;
      document.getElementById('loading').style.display = 'none';
    }

    function drawCharacter() {
      if (alreadyAssigned) return;

      const btn = document.getElementById('drawBtn');
      btn.disabled = true;
      document.getElementById('loading').style.display = 'block';
      document.getElementById('error').style.display = 'none';

      // Транзакция для безопасного выбора персонажа
      db.ref('assignments').transaction((data) => {
        if (data === null) data = { count: 0, taken: {} };

        // Проверка лимита
        if (data.count >= maxPeople) {
          return; // Отменяем транзакцию, мест нет
        }

        // Сбор занятых имен
        const takenChars = [];
        if (data.taken) {
          for (const key in data.taken) {
            takenChars.push(data.taken[key]);
          }
        }

        // Поиск свободных
        const available = characters.filter(c => !takenChars.includes(c));
        if (available.length === 0) return;

        // Выбор случайного
        const randomIndex = Math.floor(Math.random() * available.length);
        const chosen = available[randomIndex];
        const newCount = data.count + 1;

        // Запись в базу
        data.taken['p' + newCount] = chosen;
        data.count = newCount;

        // Сохранение локально
        localStorage.setItem('santa_assigned', JSON.stringify({
          character: chosen,
          num: newCount
        }));

        showResult(chosen, newCount);
        btn.textContent = "Готово! 🎉";
        
        return data;
      }, (error, committed, snapshot) => {
        document.getElementById('loading').style.display = 'none';
        if (!committed) {
          // Если транзакция не прошла (кто-то другой занял место одновременно)
          showError('Что-то пошло не так. Попробуй нажать ещё раз.');
          btn.disabled = false;
        } else if (error) {
          showError('Ошибка соединения с базой данных.');
          btn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
